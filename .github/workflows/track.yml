name: 雪球大V追踪

on:
  # 单通道（2026-09-02 起）：由 Cloudflare Worker qdii-dispatch 每天 14:30（北京时间）触发 workflow_dispatch（原 GitHub schedule 已移除）
  workflow_dispatch:            # 支持手动触发

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # 2026-08-20: 20→35，给 Playwright 抓取+LLM 留余量（关键调用已各自加超时/降级）
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖 + Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: LLM 后端健康探测
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          python -u - <<'PY'
          import os, time, requests
          # 2026-09-24 同步模型链（与 config.BACKENDS 一致）：
          # ① SenseNova deepseek-v4-flash 首选 ② Gemini 3.8 Flash ③ Agnes 2.5 兜底。
          # ⚠️ gemini-3.8-flash 为稳定版命名（无 -preview 后缀，以 portfolio 仓已落地为准）；
          # ⚠️ Gemini 免费档偶发 503「high demand」拥堵——探测如实反映当下可用性，非配置错误。
          backends = [
            ("SenseNova deepseek-v4-flash", "https://token.sensenova.cn/v1/chat/completions", os.getenv("SENSENOVA_API_KEY"), "deepseek-v4-flash", {"reasoning_effort": "low", "max_tokens": 2000}),
            ("Gemini 3.8 Flash", "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", os.getenv("GEMINI_API_KEY"), "gemini-3.8-flash", {}),
            ("Agnes 2.5-flash", "https://apihub.agnes-ai.com/v1/chat/completions", os.getenv("AGNES_API_KEY"), "agnes-2.5-flash", {}),
          ]
          for name, url, key, model, extra in backends:
            if not key:
              print(f"[probe] {name}: ⚠️ 无 Key"); continue
            t0 = time.time()
            try:
              payload = {"model": model, "messages": [{"role": "user", "content": "ok"}]}
              payload.update(extra)
              r = requests.post(url, headers={"Authorization": f"Bearer {key}"},
                                json=payload, timeout=30)
              c = ""
              try:
                m = r.json()["choices"][0]["message"]
                c = m.get("content") or m.get("reasoning_content") or ""
              except Exception: pass
              print(f"[probe] {name}: HTTP {r.status_code} in {time.time()-t0:.1f}s content={len(c)}字")
            except Exception as e:
              print(f"[probe] {name}: ❌ {type(e).__name__} {str(e)[:60]}")
          PY

      - name: 抓取并分析
        env:
          XUEQIU_USER_IDS: ${{ secrets.XUEQIU_USER_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: python -u tracker.py   # -u 实时输出，超时被杀也能看到卡点（2026-08-20）

      - name: 提交数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data reports state.json   # -A：包含 reports 清理后的删除（2026-08-20）
          git diff --cached --quiet || git commit -m "chore: 每日追踪更新 $(date +%F)"
          git push
